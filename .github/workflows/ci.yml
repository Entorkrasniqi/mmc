name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install the package with its test dependencies
        run: pip install -e ".[dev]"
      - name: The generated XTCE database must be up to date with spec/minisat.yaml
        run: minisat gen-xtce --check
      - name: Unit, end-to-end (UDP) and XTCE interpreter tests
        # XTCE_ONLINE=1 also validates the database against the official XTCE 1.2 schema, downloaded from the Yamcs repository
        run: XTCE_ONLINE=1 pytest -q
      - name: Offline demo scenario
        run: minisat demo --hours 3 --out demo_out

  database:
    # the operations layer on a real PostgreSQL (migrations, roles, privileges, constraints); no mocks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # throw-away password of a service container that only lives for this job; not a real secret
          POSTGRES_PASSWORD: ci-only-admin-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MINISAT_TEST_ADMIN_URL: postgresql://postgres:ci-only-admin-password@localhost:5432/postgres
      MINISAT_REQUIRE_DB: "1"          # fail, never skip, if the database is not reachable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the package with the database and API dependencies
        run: pip install -e ".[dev,db,api]"
      - name: Database tests, the HTTP API and the ontology definitions
        run: pytest -q tests/db tests/api tests/test_api_settings.py tests/test_dashboard_fixtures.py tests/test_ontology_definitions.py tests/test_ontology_dbconfig.py tests/test_ontology_functions.py tests/test_ontology_time_to_safe.py
      - name: The dashboard's test fixture matches the actions the API exposes
        run: python tools/dump_action_schemas.py --check
      - name: The Docker Compose file is valid
        run: docker compose --env-file .env.example config --quiet

  dashboard:
    # the web dashboard (PLAN.md phase 5): types, unit tests, production build. The browser tests (npm run e2e) need Docker
    # and a browser and are run by hand for now.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install the exact versions of the lockfile
        run: npm ci
      - name: Type check
        run: npm run typecheck
      - name: Unit and component tests
        run: npm test
      - name: Production build
        run: npm run build
