# The data store of the operations layer (ontology.md, ADR 0002). Phase 1 runs only the database;
# the backend, simulator and dashboard join this file in later phases.
#
#   cp .env.example .env            # then change the passwords
#   docker compose up -d db
#   set -a; . ./.env; set +a; alembic upgrade head
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${MINISAT_DB_NAME:-minisat}
      MINISAT_DB_PASSWORD_MIGRATOR: ${MINISAT_DB_PASSWORD_MIGRATOR:?set in .env}
      MINISAT_DB_PASSWORD_RUNNER: ${MINISAT_DB_PASSWORD_RUNNER:?set in .env}
      MINISAT_DB_PASSWORD_READER: ${MINISAT_DB_PASSWORD_READER:?set in .env}
      MINISAT_DB_PASSWORD_INGEST: ${MINISAT_DB_PASSWORD_INGEST:?set in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/roles.sql:/opt/minisat/roles.sql:ro
      - ./db/database.sql:/opt/minisat/database.sql:ro
      - ./db/init/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    ports:
      # published on this machine only, never on the network (dev convenience so the host can run migrations)
      - "127.0.0.1:${MINISAT_DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${MINISAT_DB_NAME:-minisat}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  dbdata:
