[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "minisat"
version = "0.1.0"
description = "Satellite-bus simulator (CCSDS packets over UDP) and tooling that generates the XTCE database for Yamcs mission control"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Entor Krasniqi" }]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
# the PostgreSQL store of the operations layer (ontology.md); the simulator and codec do not need it
db = ["psycopg[binary]>=3.1", "alembic>=1.13", "SQLAlchemy>=2.0"]
dev = ["pytest>=8", "lxml>=5", "matplotlib>=3.8"]

[project.scripts]
minisat = "minisat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
